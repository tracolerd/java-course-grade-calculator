<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Java Course Grade Calculator — project banner</title><desc id="desc">A Java Swing desktop utility that validates category weights and converts marks into a final percentage, letter grade and GPA.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset=".58" stop-color="#14284A"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/></linearGradient><radialGradient id="glow"><stop stop-color="#93C5FD" stop-opacity=".27"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C9D5E7" stroke-opacity=".07"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}.pulse{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs><rect width="1280" height="420" rx="28" fill="url(#bg)"/><rect width="1280" height="420" rx="28" fill="url(#grid)"/><ellipse cx="1010" cy="190" rx="310" ry="250" fill="url(#glow)"/><path d="M0 330C220 250 400 410 650 323S1030 283 1280 330" fill="none" stroke="#93C5FD" stroke-opacity=".13" stroke-width="2"/><g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="70" y="70" fill="#93C5FD" font-size="14" font-weight="700" letter-spacing="3.4">STUDENT UTILITY  /  JAVA SWING</text><text x="68" y="145" fill="#F8FAFC" font-size="39" font-weight="760" letter-spacing="-1.1">Java Course Grade Calculator</text><text x="72" y="194" fill="#CAD5E3" font-size="18">A Java Swing desktop utility that validates category</text><text x="72" y="221" fill="#CAD5E3" font-size="18">weights and converts marks into a final percentage, letter</text><rect x="72" y="252" width="410" height="3" rx="1.5" fill="url(#accent)"/><rect x="72" y="252" width="82" height="3" rx="1.5" fill="#FFF" opacity=".82" style="animation:sweep 8s linear infinite"/><rect x="72" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#93C5FD" stroke-opacity=".35"/><circle cx="89" cy="305" r="3" fill="#93C5FD"/><text x="101" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">JAVA + SWING</text><rect x="257" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#93C5FD" stroke-opacity=".35"/><circle cx="274" cy="305" r="3" fill="#93C5FD"/><text x="286" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">WEIGHTED MARKS</text><rect x="442" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#93C5FD" stroke-opacity=".35"/><circle cx="459" cy="305" r="3" fill="#93C5FD"/><text x="471" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">GRADE CONVERSION</text><text x="72" y="382" fill="#94A3B8" font-size="11" letter-spacing="2.8">WEIGHT CHECKS · CLEAR OUTPUT · STUDENT-FOCUSED</text></g><g transform="translate(1008 190)"><rect x="-138" y="-106" width="276" height="214" rx="22" fill="#07101E" fill-opacity=".84" stroke="#93C5FD" stroke-opacity=".68" stroke-width="1.6"/><text x="-112" y="-72" font-size="11" letter-spacing="2" font-family="monospace" fill="#93C5FD">GRADE SUMMARY</text><text x="-111" y="-15" font-size="51" font-weight="800" fill="#F8FAFC">A</text><text x="-46" y="-27" font-size="16" font-weight="700" fill="#93C5FD">3.75 GPA</text><text x="-44" y="-7" font-size="10" fill="#94A3B8">illustrative preview</text><path d="M-110 13H110" stroke="#FFFFFF" stroke-opacity=".13"/><text x="-110" y="36" font-size="10" fill="#CBD5E1">Assignment</text><rect x="-20" y="27" width="120" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".08"/><rect x="-20" y="27" width="96" height="9" rx="4.5" fill="#93C5FD"/><text x="-110" y="58" font-size="10" fill="#CBD5E1">Midterm</text><rect x="-20" y="49" width="120" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".08"/><rect x="-20" y="49" width="74" height="9" rx="4.5" fill="#2563EB"/><text x="-110" y="80" font-size="10" fill="#CBD5E1">Final exam</text><rect x="-20" y="71" width="120" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".08"/><rect x="-20" y="71" width="105" height="9" rx="4.5" fill="#93C5FD"/><circle cx="126" cy="-94" r="6" fill="#93C5FD" class="pulse"/></g></svg>